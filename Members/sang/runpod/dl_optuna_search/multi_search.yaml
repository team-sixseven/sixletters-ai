search:
  learning_rate: {type: float, low: 0.0001, high: 0.003, log: true}
  weight_decay: {type: float, low: 0.000001, high: 0.001, log: true}
  classifier_dropout: {type: categorical, choices: [0.0, 0.1, 0.3]}
  tcn_hidden_dim: {type: categorical, choices: [16, 32, 64]}
  tcn_kernel_size: {type: categorical, choices: [3, 5]}
  sequence_dropout: {type: categorical, choices: [0.0, 0.1, 0.3]}
  transformer_layers: {type: categorical, choices: [1, 2]}
